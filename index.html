];

  { name: "Aarav Sharma", course: "CEE 2024", avatar: "AS", text: "StudyNest's free notes and mock tests were the only thing I used for CEE prep. Scored 87%!", rank: "#42 Nationwide" },

// ─── HELPERS ─────────────────────────────────────────────────────────────────

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function StudyNest() {
  const [darkMode, setDarkMode] = useState(false);
  const [page, setPage] = useState("home");
  const [activeCourse, setActiveCourse] = useState("CEE");
  const [quizState, setQuizState] = useState(null); // null | { qi, score, chosen, done }
  const [mobileMenu, setMobileMenu] = useState(false);
  const t = darkMode ? THEMES.dark : THEMES.light;

  const css = `
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sora', sans-serif; background: ${t.bg}; color: ${t.text}; transition: background 0.3s, color 0.3s; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: ${t.bgMuted}; } ::-webkit-scrollbar-thumb { background: ${t.accent}; border-radius: 10px; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; outline: none; font-family: inherit; }
    input { font-family: inherit; }
    .page-enter { animation: fadeUp 0.45s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px);} to { opacity:1; transform:none; } }
    .card-hover { transition: transform 0.22s, box-shadow 0.22s; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 32px ${t.shadowMd}; }
    .btn-primary { background: ${t.accent}; color: #fff; border-radius: 12px; padding: 12px 24px; font-weight: 700; font-size: 14px; transition: background 0.2s, transform 0.15s; letter-spacing: 0.3px; }
    .btn-primary:hover { background: ${t.accentHover}; transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1.5px solid ${t.border}; color: ${t.text}; border-radius: 12px; padding: 11px 22px; font-weight: 600; font-size: 14px; transition: border-color 0.2s, background 0.2s; }
    .btn-outline:hover { border-color: ${t.accent}; background: ${t.accentSoft}; color: ${t.accent}; }
    .btn-teal { background: ${t.teal}; color: #fff; border-radius: 12px; padding: 11px 22px; font-weight: 700; font-size: 14px; transition: opacity 0.2s; }
    .btn-teal:hover { opacity: 0.88; }
    .section-title { font-size: clamp(22px, 4vw, 34px); font-weight: 800; color: ${t.text}; }
    .section-sub { font-size: 15px; color: ${t.textMid}; margin-top: 8px; line-height: 1.6; }
    .tag { display: inline-block; background: ${t.badge}; color: ${t.badgeText}; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.4px; }
    @media (max-width: 700px) {
      .hide-mobile { display: none !important; }
      .grid-2 { grid-template-columns: 1fr !important; }
      .grid-3 { grid-template-columns: 1fr 1fr !important; }
      .hero-btns { flex-direction: column; }
    }
  `;

  const NAV = [
    { id: "home", label: "Home" },
    { id: "courses", label: "Courses" },
    { id: "materials", label: "Materials" },
    { id: "tests", label: "Mock Tests" },
    { id: "quiz", label: "Quiz" },
  ];

  const goto = (p) => { setPage(p); setMobileMenu(false); window.scrollTo(0,0); };

  return (
    <>
      <style>{css}</style>
      {/* NAV */}
      <nav style={{ position: "sticky", top: 0, zIndex: 100, background: t.bgCard, borderBottom: `1px solid ${t.border}`, boxShadow: `0 2px 12px ${t.shadow}` }}>
        <div style={{ maxWidth: 1180, margin: "0 auto", padding: "0 20px", height: 64, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          {/* Logo */}
          <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => goto("home")}>
            <div style={{ width: 36, height: 36, background: `linear-gradient(135deg, ${t.accent}, ${t.teal})`, borderRadius: 10, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>📖</div>
            <span style={{ fontWeight: 800, fontSize: 20, color: t.accent, fontFamily: "Lora, serif", letterSpacing: -0.5 }}>StudyNest</span>
          </div>
          {/* Desktop Nav */}
          <div className="hide-mobile" style={{ display: "flex", gap: 4 }}>
            {NAV.map(n => (
              <button key={n.id} onClick={() => goto(n.id)} style={{ background: page === n.id ? t.accentSoft : "transparent", color: page === n.id ? t.accent : t.textMid, borderRadius: 10, padding: "8px 16px", fontWeight: 600, fontSize: 14, transition: "all 0.18s" }}>{n.label}</button>
            ))}
          </div>
          {/* Right */}
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => setDarkMode(!darkMode)} style={{ width: 40, height: 40, borderRadius: 12, background: t.bgMuted, color: t.text, fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", transition: "background 0.2s" }}>{darkMode ? "☀️" : "🌙"}</button>
            <button className="btn-primary hide-mobile" onClick={() => goto("courses")} style={{ padding: "8px 18px", fontSize: 13 }}>Get Started</button>
            <button onClick={() => setMobileMenu(!mobileMenu)} style={{ display: "none", width: 40, height: 40, borderRadius: 12, background: t.bgMuted, color: t.text, fontSize: 20, alignItems: "center", justifyContent: "center" }} className="show-mobile-flex">☰</button>
          </div>
        </div>
        {/* Mobile menu — always render, toggle visibility */}
        <div style={{ display: mobileMenu ? "block" : "none", background: t.bgCard, borderTop: `1px solid ${t.border}`, padding: "12px 20px 16px" }}>
          {NAV.map(n => (
            <button key={n.id} onClick={() => goto(n.id)} style={{ display: "block", width: "100%", textAlign: "left", background: page === n.id ? t.accentSoft : "transparent", color: page === n.id ? t.accent : t.text, borderRadius: 10, padding: "12px 16px", fontWeight: 600, fontSize: 15, marginBottom: 4 }}>{n.label}</button>
          ))}
        </div>
      </nav>

      {/* PAGES */}
      <div className="page-enter" key={page} style={{ minHeight: "calc(100vh - 64px)" }}>
        {page === "home" && <HomePage t={t} goto={goto} setActiveCourse={setActiveCourse} darkMode={darkMode} />}
        {page === "courses" && <CoursesPage t={t} goto={goto} activeCourse={activeCourse} setActiveCourse={setActiveCourse} />}
        {page === "materials" && <MaterialsPage t={t} activeCourse={activeCourse} setActiveCourse={setActiveCourse} />}
        {page === "tests" && <TestsPage t={t} goto={goto} setQuizState={setQuizState} />}
        {page === "quiz" && <QuizPage t={t} quizState={quizState} setQuizState={setQuizState} />}
      </div>

      {/* DEV CTA */}
      <div style={{ padding: "80px 24px", background: t.bgMuted, display: "flex", justifyContent: "center" }}>
        <div style={{ maxWidth: 900, width: "100%", background: t.bgCard, borderRadius: 32, padding: "48px 40px", border: `1px solid ${t.border}`, boxShadow: `0 16px 48px ${t.shadow}`, display: "flex", flexWrap: "wrap", alignItems: "center", gap: 40, position: "relative", overflow: "hidden" }}>
          {/* Background decorations */}
          <div style={{ position: "absolute", top: -50, right: -50, width: 200, height: 200, borderRadius: "50%", background: `radial-gradient(circle, ${t.accent}22, transparent 70%)` }} />
          <div style={{ position: "absolute", bottom: -50, left: 100, width: 300, height: 300, borderRadius: "50%", background: `radial-gradient(circle, ${t.teal}11, transparent 70%)` }} />
          
          <div style={{ flex: "1 1 400px", position: "relative" }}>
            <div style={{ display: "inline-flex", background: t.accentSoft, color: t.accent, padding: "4px 12px", borderRadius: 20, fontSize: 12, fontWeight: 700, letterSpacing: 0.5, marginBottom: 16 }}>
              SYSTEM ARCHITECTURE
            </div>
            <h2 style={{ fontFamily: "Lora, serif", fontWeight: 800, fontSize: "clamp(28px, 4vw, 36px)", color: t.text, marginBottom: 12, lineHeight: 1.1 }}>
              Engineered by <br /><span style={{ color: t.accent }}>Sushant Raj Mishra</span>
            </h2>
            <p style={{ color: t.textMid, fontSize: 15, lineHeight: 1.6, marginBottom: 28, maxWidth: 420 }}>
              Experience the pinnacle of fluid UI motion and flawless scalable system architectures crafted to perfection.
            </p>
            <a href="https://sushantrm.com.np/" target="_blank" className="btn-primary" style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "14px 28px", fontSize: 15 }}>
              Hire Developer
              <span style={{ fontSize: 18 }}>↗</span>
            </a>
          </div>

          <div style={{ flex: "1 1 250px", display: "flex", justifyContent: "center" }}>
            <div style={{ background: t.bgAlt, border: `1px solid ${t.border}`, borderRadius: 24, padding: 32, width: "100%", maxWidth: 320, textAlign: "center", position: "relative", boxShadow: `0 4px 20px ${t.shadow}` }}>
              <div style={{ fontWeight: 700, fontSize: 18, color: t.text, marginBottom: 6 }}>Dimensions</div>
              <p style={{ color: t.textMuted, fontSize: 13, marginBottom: 28 }}>Tap to switch the visual mode</p>
              
              <div 
                onClick={() => setDarkMode(!darkMode)}
                style={{ margin: "0 auto", cursor: "pointer", width: 160, height: 60, borderRadius: 50, background: darkMode ? t.navy : "#E2E8F4", border: `2px solid ${darkMode ? t.border : "#fff"}`, position: "relative", transition: "all 0.3s cubic-bezier(0.4,0,0.2,1)", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 18px" }}
              >
                <span style={{ fontSize: 20, filter: darkMode ? "grayscale(1) opacity(0.3)" : "none" }}>☀️</span>
                <span style={{ fontSize: 20, filter: !darkMode ? "grayscale(1) opacity(0.3)" : "none" }}>🌙</span>
                <div style={{ position: "absolute", top: 4, left: darkMode ? "calc(100% - 52px)" : 4, width: 48, height: 48, borderRadius: "50%", background: "#fff", boxShadow: "0 4px 12px rgba(0,0,0,0.15)", transition: "all 0.4s cubic-bezier(0.34,1.56,0.64,1)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <div style={{ width: 18, height: 18, borderRadius: "50%", background: darkMode ? t.accent : "#F59E0B" }} />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* FOOTER */}
      <footer style={{ background: t.navy, color: "#fff", padding: "48px 24px 28px", marginTop: 0 }}>
        <div style={{ maxWidth: 1180, margin: "0 auto" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 32, marginBottom: 40 }}>
            <div>
              <div style={{ fontFamily: "Lora, serif", fontWeight: 800, fontSize: 22, marginBottom: 12, color: t.accent }}>StudyNest</div>
              <p style={{ fontSize: 13, color: "#A8B5CC", lineHeight: 1.7 }}>Free, high-quality study resources for CEE, IOE, NEET & JEE aspirants across Nepal and India.</p>
            </div>
            {[["Courses","CEE","IOE","NEET","JEE"],["Resources","Free Notes","Mock Tests","PYQ Papers","Formula Sheets"],["Community","Forums","Leaderboard","Study Groups","Blog"]].map(([head,...items]) => (
              <div key={head}>
                <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12, color: "#E2E8F4", letterSpacing: 0.5 }}>{head}</div>
                {items.map(i => <div key={i} style={{ fontSize: 13, color: "#637085", marginBottom: 8, cursor: "pointer" }}>{i}</div>)}
              </div>
            ))}
          </div>
          <div style={{ borderTop: "1px solid #263050", paddingTop: 24, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 12, fontSize: 12, color: "#637085" }}>
            <span>© 2025 StudyNest. All resources are free for students.</span>
            <span>Made with ❤️ for aspirants</span>
          </div>
        </div>
      </footer>
    </>
  );
}

// ─── HOME PAGE ────────────────────────────────────────────────────────────────
function HomePage({ t, goto, setActiveCourse, darkMode }) {
  return (
    <div>
      {/* HERO */}
      <section style={{ background: `linear-gradient(135deg, ${t.bgAlt} 0%, ${t.accentSoft} 100%)`, padding: "72px 24px 80px", textAlign: "center", position: "relative", overflow: "hidden" }}>
        {/* Decorative blobs */}
        <div style={{ position: "absolute", top: -60, right: -60, width: 280, height: 280, borderRadius: "50%", background: `radial-gradient(circle, ${t.accent}18, transparent 70%)`, pointerEvents: "none" }} />
        <div style={{ position: "absolute", bottom: -40, left: -40, width: 200, height: 200, borderRadius: "50%", background: `radial-gradient(circle, ${t.teal}18, transparent 70%)`, pointerEvents: "none" }} />
        <div style={{ maxWidth: 760, margin: "0 auto", position: "relative" }}>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 8, background: t.bgCard, border: `1px solid ${t.border}`, borderRadius: 40, padding: "6px 16px", fontSize: 12, fontWeight: 700, color: t.teal, marginBottom: 28, boxShadow: `0 2px 12px ${t.shadow}` }}>
            🎓 100% FREE — No Subscriptions, No Paywalls
          </div>
          <h1 style={{ fontFamily: "Lora, serif", fontWeight: 700, fontSize: "clamp(32px,6vw,58px)", lineHeight: 1.15, color: t.text, marginBottom: 20 }}>
            Crack <span style={{ color: t.accent }}>CEE, IOE,</span><br />
            <span style={{ color: t.teal }}>NEET & JEE</span> — For Free.

          <p style={{ fontSize: "clamp(14px,2.5vw,18px)", color: t.textMid, lineHeight: 1.7, marginBottom: 36, maxWidth: 580, margin: "0 auto 36px" }}>

          </p>
          <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap" }} className="hero-btns">
            <button className="btn-primary" onClick={() => goto("courses")} style={{ fontSize: 16, padding: "14px 32px" }}>Explore Courses →</button>
            <button className="btn-outline" onClick={() => goto("materials")} style={{ fontSize: 16, padding: "14px 32px" }}>Free Materials</button>

        </div>
      </section>

      {/* STATS */}
      <section style={{ background: t.accent, padding: "28px 24px" }}>
        <div style={{ maxWidth: 1000, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>

            <div key={s.label} style={{ textAlign: "center", padding: "12px 8px" }}>

          ))}

      </section>

      {/* COURSES GRID */}
      <section style={{ padding: "72px 24px", background: t.bg }}>
        <div style={{ maxWidth: 1180, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 48 }}>
            <span className="tag">Our Courses</span>
            <h2 className="section-title" style={{ marginTop: 10 }}>Choose Your Exam Path</h2>
            <p className="section-sub">Structured content crafted by toppers and educators for each entrance exam.</p>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: 24 }} className="grid-2">
            {COURSES.map(c => (
              <div key={c.id} className="card-hover" onClick={() => { setActiveCourse(c.label); goto("courses"); }} style={{ background: t.bgCard, borderRadius: 20, padding: "28px 24px", border: `1px solid ${t.border}`, cursor: "pointer", position: "relative", overflow: "hidden" }}>

// ─── QUIZ PAGE ────────────────────────────────────────────────────────────────
function QuizPage({ t, quizState, setQuizState }) {
  const init = () => setQuizState({ qi: 0, score: 0, chosen: null, done: false });
  useEffect(() => { if (!quizState) init(); }, []);

  if (!quizState) return <div style={{ padding: 40, textAlign: "center", color: t.textMuted }}>Loading quiz...</div>;

  const { qi, score, chosen, done } = quizState;
  const q = SAMPLE_QS[qi];
  const total = SAMPLE_QS.length;

  const choose = (idx) => {
    if (chosen !== null) return;
    const correct = idx === q.ans;
    setQuizState(prev => ({ ...prev, chosen: idx, score: correct ? prev.score + 1 : prev.score }));
  };

  const next = () => {
    if (qi + 1 >= total) setQuizState(prev => ({ ...prev, done: true }));
    else setQuizState(prev => ({ ...prev, qi: prev.qi + 1, chosen: null }));
  };

  const pct = Math.round((score / total) * 100);

  return (
    <div style={{ padding: "48px 24px", maxWidth: 760, margin: "0 auto" }}>
      <div style={{ marginBottom: 36 }}>
        <span className="tag">Live Quiz</span>
        <h1 className="section-title" style={{ marginTop: 10 }}>Science & Math Quiz</h1>
      </div>

      {done ? (
        <div style={{ background: t.bgCard, borderRadius: 24, border: `1px solid ${t.border}`, padding: "48px 32px", textAlign: "center" }}>
          <div style={{ fontSize: 72, marginBottom: 16 }}>{pct >= 75 ? "🏆" : pct >= 50 ? "👍" : "📚"}</div>
          <h2 style={{ fontWeight: 800, fontSize: 32, color: t.text, marginBottom: 8 }}>Quiz Complete!</h2>
          <p style={{ fontSize: 18, color: t.textMid, marginBottom: 8 }}>You scored <span style={{ color: t.accent, fontWeight: 800 }}>{score}</span> out of <span style={{ fontWeight: 800 }}>{total}</span></p>
          <div style={{ fontSize: 48, fontWeight: 800, color: pct >= 75 ? t.teal : pct >= 50 ? t.accent : "#DC2626", margin: "16px 0" }}>{pct}%</div>
          <p style={{ color: t.textMuted, fontSize: 14, marginBottom: 32 }}>
            {pct >= 75 ? "Excellent! You're well prepared." : pct >= 50 ? "Good effort! Keep practicing." : "Keep studying — you'll get there!"}
          </p>
          <button className="btn-primary" style={{ fontSize: 16, padding: "14px 32px" }} onClick={init}>Try Again 🔄</button>
        </div>
      ) : (
        <div style={{ background: t.bgCard, borderRadius: 24, border: `1px solid ${t.border}`, overflow: "hidden" }}>
          {/* Progress */}
          <div style={{ padding: "20px 28px", borderBottom: `1px solid ${t.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: t.textMid }}>Question {qi + 1} of {total}</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: t.accent }}>Score: {score}</span>
          </div>
          <div style={{ padding: "2px 0", background: t.bgMuted }}>
            <div style={{ height: 4, background: t.accent, width: `${((qi + 1) / total) * 100}%`, transition: "width 0.4s ease" }} />
          </div>

          {/* Question */}
          <div style={{ padding: "32px 28px" }}>
            <h2 style={{ fontWeight: 700, fontSize: "clamp(15px, 3vw, 18px)", color: t.text, lineHeight: 1.6, marginBottom: 28 }}>{q.q}</h2>

            {/* Options */}
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {q.opts.map((opt, idx) => {
                let bg = t.bgMuted;
                let border = t.border;
                let color = t.text;
                if (chosen !== null) {
                  if (idx === q.ans) { bg = "#D1FAE5"; border = "#059669"; color = "#065F46"; }
                  else if (idx === chosen && chosen !== q.ans) { bg = "#FEE2E2"; border = "#DC2626"; color = "#991B1B"; }
                  else { bg = t.bgMuted; border = t.border; color = t.textMuted; }
                }
                return (
                  <button key={idx} onClick={() => choose(idx)} style={{ textAlign: "left", background: bg, border: `2px solid ${border}`, borderRadius: 14, padding: "16px 20px", fontSize: 14, fontWeight: 600, color, transition: "all 0.2s", display: "flex", alignItems: "center", gap: 14 }}>
                    <span style={{ width: 28, height: 28, borderRadius: "50%", border: `2px solid ${border}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 800, flexShrink: 0 }}>
                      {chosen !== null && idx === q.ans ? "✓" : chosen !== null && idx === chosen && chosen !== q.ans ? "✗" : String.fromCharCode(65 + idx)}
                    </span>
                    {opt}
                  </button>
                );
              })}
            </div>

            {/* Next */}
            {chosen !== null && (
              <div style={{ marginTop: 28, display: "flex", justifyContent: "flex-end" }}>
                <button className="btn-primary" style={{ fontSize: 15, padding: "12px 28px" }} onClick={next}>
                  {qi + 1 >= total ? "See Results 🏁" : "Next Question →"}
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}


    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudyNest />);
  </script>
